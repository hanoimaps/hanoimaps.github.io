<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no,
    viewport-fit=cover"
    />
    <title>Hanoi Maps | Events</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/shared.css" />
    <link
      href="https://unpkg.com/maplibre-gl@^5.9.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@^5.9.0/dist/maplibre-gl.js"></script>
    <style>
      html,
      body {
        touch-action: manipulation;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        background-color: #222;
        box-sizing: border-box;
      }

      #map {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* POPUP */
      .maplibregl-popup-content {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #ffffff;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        padding: 16px 18px 22px;
        gap: 4px;
        width: 236px;
        overflow-y: auto;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
        border-top-color: #ffffff;
      }
      .popup-title {
        font-family: Georgia, Charter, "Times New Roman", serif;
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 8px;
        color: #222;
      }
      .popup {
        display: flex;
        flex-direction: column;
      }
      .popup-thumb {
        display: block;
        width: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        margin: -16px -18px 10px;
        background: #f2f2f2;
      }
      .popup-host {
        display: flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        color: #777;
        font-size: 14px;
        margin-bottom: 14px;
        text-decoration: none;
      }
      .popup-host span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .popup-host b {
        font-size: 17px;
        font-weight: 400;
      }
      .popup-time {
        font-size: 14px;
        margin-bottom: 22px;
        color: #1a1a1a;
      }
      .popup-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .popup-map {
        flex: none;
        width: 36px;
        height: 36px;
        border: 1px solid #d5d5d5;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .popup-map svg {
        width: 18px;
        height: 18px;
        stroke: #707784;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .popup .popup-detail {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 16px;
        border: 1px solid #d5d5d5;
        border-radius: 999px;
        background: transparent;
        color: #777;
        font-size: 14px;
        transition: 0.15s;
      }
      .popup a {
        text-decoration: none;
        transition: 0.15s;
      }
      .popup a:hover {
        opacity: 0.75;
      }

      /* PAGINATION */
      .popup-navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      .popup-navigation button {
        font: inherit;
        background: #f2f2f2;
        color: #1a1a1a;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .popup-navigation button:hover {
        background: #e8e8e8;
      }
      .popup-navigation button:disabled {
        background: #f7f7f7;
        color: #bfbfbf;
        cursor: not-allowed;
      }
      .popup-pagination-counter {
        font-size: 13px;
        font-weight: 600;
        color: #6b7280;
      }
      /* SWITCH MAP */
      .maplibregl-ctrl-group .style-switcher-button {
        width: 29px;
        height: 29px;
        background-color: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        border-radius: 4px;
      }
      .maplibregl-ctrl-group .style-switcher-button .style-switcher-icon {
        width: 18px;
        height: 18px;
        filter: invert(0%);
        transition: filter 0.3s ease;
      }
      .maplibregl-ctrl-group .style-switcher-button.is-satellite {
        background-color: rgba(30, 30, 30);
      }
      .maplibregl-ctrl-group
        .style-switcher-button.is-satellite
        .style-switcher-icon {
        filter: invert(100%);
      }

      /* CALENDAR */
      #controls {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
        z-index: 10;
      }
      #calendar-icon,
      #reset-button {
        padding: 12px;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        background-color: white;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #reset-button[hidden] {
        display: none;
        opacity: 0;
      }
      #calendar-wrapper {
        position: relative;
      }
      #calendar-popover {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        padding: 12px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        z-index: 20;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      #calendar-popover[hidden] {
        display: none;
      }
      .cal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .cal-head span {
        font-weight: 600;
        font-size: 14px;
        color: #222;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 32px);
        gap: 2px;
        justify-content: space-between;
      }
      .cal-weekdays {
        margin-bottom: 4px;
      }
      .cal-weekdays span {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 24px;
        font-size: 11px;
        color: #999;
      }
      .cal-head button,
      .cal-days button {
        border: none;
        background: none;
        cursor: pointer;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cal-head button {
        font-size: 18px;
        color: #666;
      }
      .cal-head button:hover,
      .cal-days button:hover {
        background: #f0f0f0;
      }
      .cal-days button {
        position: relative;
      }
      .cal-days button.today {
        background: #ececec;
      }
      .cal-days button.has-events::after {
        content: "";
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #1a1a1a;
      }
      .cal-days button.selected {
        background: #1a1a1a;
        color: #fff;
      }
      .cal-days button.selected.has-events::after {
        background: #fff;
      }
      #calendar-icon svg,
      #reset-button svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      #calendar-wrapper {
        position: relative;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <div id="calendar-wrapper">
        <button
          id="calendar-icon"
          type="button"
          title="Chọn ngày"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-calendar3"
            viewBox="0 0 16 16"
          >
            <path
              d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2M1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857z"
            />
            <path
              d="M6.5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2"
            />
          </svg>
        </button>
        <div id="calendar-popover" role="dialog" aria-label="Chọn ngày" hidden>
          <div class="cal-head">
            <button id="cal-prev" type="button" aria-label="Tháng trước">
              ‹
            </button>
            <span id="cal-title"></span>
            <button id="cal-next" type="button" aria-label="Tháng sau">
              ›
            </button>
          </div>
          <div class="cal-grid cal-weekdays">
            <span>T2</span><span>T3</span><span>T4</span><span>T5</span
            ><span>T6</span><span>T7</span><span>CN</span>
          </div>
          <div class="cal-grid cal-days" id="cal-days"></div>
        </div>
      </div>

      <button id="reset-button" title="Hiện tất cả" hidden>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-arrow-counterclockwise"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"
          />
          <path
            d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"
          />
        </svg>
      </button>
    </div>
    <script src="calendar.js" defer></script>
    <script type="module">
      import {
        ExpandableMenuControl,
        addCompassControl,
        createSiteNavPanel,
      } from "../shared.js";

      const siteMenuControl = new ExpandableMenuControl(
        createSiteNavPanel("events")
      );

      // --- 0. CORE FLOW ---
      window.onload = async function () {
        const isDataLoaded = await loadEvents("events.json");
        if (isDataLoaded) {
          initializeMap();
          setupEventListeners();
          // Shareable filter: ?date=YYYY-MM-DD opens the map pre-filtered
          const shared = new URLSearchParams(location.search).get("date");
          if (/^\d{4}-\d{2}-\d{2}$/.test(shared || "")) {
            selectedDate = shared;
            filterByDate(shared);
          }
        } else {
          document.getElementById("map").innerHTML =
            '<h1 style="text-align: center;">Không tìm thấy dữ liệu.</h1>';
        }
      };

      // --- 1. CONSTANTS ---
      let map;
      let geojsonData = null;
      const DATA_SOURCE_ID = "event-points-source";
      const EVENT_LAYER_ID = "event-circles";
      const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: true,
        offset: 15,
        anchor: "bottom",
      });
      const apiKey = "yirfoVznNRHBz863QlU2";
      const STREETS_STYLE = `https://api.maptiler.com/maps/streets-v2/style.json?key=${apiKey}`;
      const SATELLITE_HYBRID_STYLE = {
        version: 8,
        metadata: { "maplibregl:arbitrary-bottom-layer-id": "aerial-layer" },
        sources: {
          "esri-world-imagery": {
            type: "raster",
            tiles: [
              "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            ],
            tileSize: 256,
            maxzoom: 19,
            attribution:
              '<a href="https://hanoimaps.github.io/events/sources" target="_blank" style="text-decoration: underline">Sources</a> | Tiles © Esri World Imagery',
          },
          "maptiler-streets": {
            type: "vector",
            url: `https://api.maptiler.com/tiles/v3/tiles.json?key=${apiKey}`,
          },
        },
        glyphs: `https://api.maptiler.com/fonts/{fontstack}/{range}.pbf?key=${apiKey}`,
        center: [105.8542, 21.0285],
        zoom: 12,
        layers: [
          {
            id: "aerial-layer",
            type: "raster",
            source: "esri-world-imagery",
            minzoom: 0,
            maxzoom: 24,
          },
          {
            id: "road_label",
            type: "symbol",
            source: "maptiler-streets",
            "source-layer": "transportation_name",
            minzoom: 12,
            layout: {
              "text-field": "{name}",
              "text-font": ["Roboto Regular", "Arial Unicode MS Regular"],
              "text-size": {
                base: 1.2,
                stops: [
                  [12, 10],
                  [15, 12],
                  [18, 14],
                ],
              },
              "text-transform": "uppercase",
              "text-rotation-alignment": "map",
              "symbol-placement": "line",
              "symbol-spacing": 350,
              "text-allow-overlap": false,
            },
            paint: {
              "text-color": "#d9d9d9",
              "text-halo-color": "rgba(0, 0, 0, 0.8)",
              "text-halo-width": 1.2,
            },
          },
          {
            id: "place_label",
            type: "symbol",
            source: "maptiler-streets",
            "source-layer": "place",
            layout: {
              "text-field": "{name}",
              "text-font": ["Roboto Regular", "Arial Unicode MS Regular"],
              "text-size": 14,
              "text-variable-anchor": ["bottom"],
              "text-radial-offset": 0.5,
              "text-justify": "auto",
              "symbol-sort-key": ["get", "rank"],
              "text-allow-overlap": false,
            },
            paint: {
              "text-color": "#FFFFFF",
              "text-halo-color": "rgba(0, 0, 0, 0.8)",
              "text-halo-width": 1.5,
            },
          },
        ],
      };

      function initializeMap() {
        map = new maplibregl.Map({
          container: "map",
          style: STREETS_STYLE,
          center: [105.8542, 21.0285],
          zoom: 12.5,
          maxBounds: [
            [105.5, 20.7],
            [106.1, 21.5],
          ],
          attributionControl: false,
        });
        map.addControl(siteMenuControl, "top-left");
        map.on("click", () => siteMenuControl.close());
        map.addControl(
          new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
          }),
          "top-left"
        );
        map.addControl(
          new StyleSwitcherControl({
            streets: STREETS_STYLE,
            satellite: SATELLITE_HYBRID_STYLE,
          }),
          "top-left"
        );
        addCompassControl(map, "top-left");
        map.addControl(
          new maplibregl.AttributionControl({
            customAttribution:
              '<a href="https://hanoimaps.github.io/events/sources" target="_blank" style="text-decoration: underline">Sources</a>',
            compact: true,
          }),
          "top-right"
        );
        map.on("load", () => {
          modifyBaseStyle(map);
          addDataLayer(map, geojsonData);
          // Shared-link / reload path: filterByDate ran before the style was
          // ready, so (re)apply the pending date filter now that it can stick.
          if (selectedDate) filterByDate(selectedDate);
        });
      }

      async function loadEvents(geoJsonUrl) {
        try {
          // no-cache = always revalidate (304 if unchanged): fresh events, one cheap request
          const response = await fetch(geoJsonUrl, { cache: "no-cache" });
          if (!response.ok)
            throw new Error(`HTTP error! status: ${response.status}`);
          geojsonData = await response.json();
          setCalendarEvents(geojsonData.features);
          return geojsonData.features.length > 0;
        } catch (error) {
          console.error("Error loading GeoJSON data:", error);
          return false;
        }
      }

      class StyleSwitcherControl {
        constructor(styles) {
          this._streets = styles.streets;
          this._satellite = styles.satellite;
          this._isSatellite = false;
        }
        onAdd(map) {
          this._map = map;
          this._container = document.createElement("div");
          this._container.className = "maplibregl-ctrl maplibregl-ctrl-group";
          this._button = document.createElement("button");
          this._button.type = "button";
          this._button.className = "style-switcher-button";
          this._button.onclick = () => this.toggleStyle();
          this._button.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="style-switcher-icon"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;
          this.updateButton();
          this._container.appendChild(this._button);
          return this._container;
        }
        updateButton() {
          if (this._isSatellite) {
            this._button.classList.add("is-satellite");
          } else {
            this._button.classList.remove("is-satellite");
          }
        }
        toggleStyle() {
          this._isSatellite = !this._isSatellite;
          this.updateButton();
          const newStyle = this._isSatellite ? this._satellite : this._streets;
          this._map.setStyle(newStyle);

          this._map.once("styledata", () => {
            if (!this._isSatellite) {
              modifyBaseStyle(this._map);
            }
            addDataLayer(this._map, geojsonData);
            if (selectedDate) {
              filterByDate(selectedDate);
            }
          });
        }
        onRemove() {
          this._container.parentNode.removeChild(this._container);
          this._map = undefined;
        }
      }

      function addDataLayer(map, geojsonData) {
        if (map.getLayer(EVENT_LAYER_ID)) map.removeLayer(EVENT_LAYER_ID);
        if (map.getSource(DATA_SOURCE_ID)) map.removeSource(DATA_SOURCE_ID);
        map.addSource(DATA_SOURCE_ID, { type: "geojson", data: geojsonData });
        map.addLayer({
          id: EVENT_LAYER_ID,
          type: "circle",
          source: DATA_SOURCE_ID,
          paint: {
            "circle-color": ["literal", "#3b1753"],
            "circle-radius": [
              "interpolate",
              ["linear"],
              ["zoom"],
              12,
              7,
              16,
              16,
            ],
            "circle-stroke-width": 1.5,
            "circle-stroke-color": "#fff",
            "circle-opacity": 0.8,
          },
        });
        addInteractivityForLayer(map);
      }

      function addInteractivityForLayer(map) {
        map.on("click", EVENT_LAYER_ID, (e) => {
          const features = map
            .queryRenderedFeatures(e.point, { layers: [EVENT_LAYER_ID] })
            // ponytail: map order isn't guaranteed; YYYY-MM-DD sorts lexicographically
            .sort((a, b) =>
              (a.properties.from_date || "").localeCompare(
                b.properties.from_date || ""
              )
            );

          if (!features.length) return;

          const coords = e.features[0].geometry.coordinates.slice();
          while (Math.abs(e.lngLat.lng - coords[0]) > 180) {
            coords[0] += e.lngLat.lng > coords[0] ? 360 : -360;
          }

          let currentEventIndex = 0;

          function updatePopupContent() {
            const html = generatePaginatedPopupContent(
              features,
              currentEventIndex
            );
            popup.setHTML(html);
            // Cần một độ trễ nhỏ để DOM cập nhật trước khi gắn listener
            setTimeout(attachPopupListeners, 0);
          }
          function attachPopupListeners() {
            // Lấy các nút từ bên trong đối tượng popup
            const prevButton = popup.getElement().querySelector("#popup-prev");
            const nextButton = popup.getElement().querySelector("#popup-next");

            if (prevButton) {
              prevButton.addEventListener("click", (e) => {
                e.stopPropagation(); // Ngăn click lan ra bản đồ
                if (currentEventIndex > 0) {
                  currentEventIndex--;
                  updatePopupContent();
                }
              });
            }

            if (nextButton) {
              nextButton.addEventListener("click", (e) => {
                e.stopPropagation(); // Ngăn click lan ra bản đồ
                if (currentEventIndex < features.length - 1) {
                  currentEventIndex++;
                  updatePopupContent();
                }
              });
            }
          }

          //   let itemsHtml = "";
          //   features.forEach((feature, index) => {
          //     const props = feature.properties;

          //     if (index > 0) {
          //       itemsHtml +=
          //         '<hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.3); margin: 10px 0;">';
          //     }

          //     itemsHtml += `
          //       <div>
          //           <h3 class="popup-title">${props.number}. ${props.name_vn}</h3>
          //           <p style="margin: 2px 0; font-size: 13px;">Từ ${
          //             props.from_date
          //           }</p>
          //           <p style="margin: 2px 0; font-size: 13px;">Đến ${
          //             props.to_date
          //           }</p>
          //           <strong>Khai mạc:</strong> ${props.start_date}
          //             (lúc ${props.start_time})
          //           <br>
          //           ${
          //             props.address_url
          //               ? `<a
          //                       href="${props.address_url}"
          //                       target="_blank"
          //                       rel="noopener noreferrer"
          //                       class="marker-btn">
          //                       ${props.address}
          //                   </a>`
          //               : `<span style="font-size: 13px;">${props.address}</span>` // Fallback nếu không có address_url
          //           }
          //       </div>
          //     `;
          //   });
          //   const popupHTML = `<div class="popup">${itemsHtml}</div>`;

          map.flyTo({
            center: coords,
            zoom: map.getZoom(),
            duration: 900,
            curve: 1.42,
            essential: true,
            offset: [0, 200],
          });

          setTimeout(() => {
            const initialHtml = generatePaginatedPopupContent(
              features,
              currentEventIndex
            );
            popup.setLngLat(coords).setHTML(initialHtml).addTo(map);

            attachPopupListeners();
          }, 600);
        });

        map.on("mouseenter", EVENT_LAYER_ID, () => {
          map.getCanvas().style.cursor = "pointer";
        });

        map.on("mouseleave", EVENT_LAYER_ID, () => {
          map.getCanvas().style.cursor = "";
        });
      }

      function modifyBaseStyle(map) {
        const layersToRecolor = ["Grass", "Meadow", "Forest", "Wood", "Scrub"];
        const layersToHide = [
          "Residential",
          "Industrial",
          "Other border",
          "Disputed border",
        ];
        const pathsToRecolor = ["Path", "Path minor"];
        layersToRecolor.forEach((id) => {
          if (map.getLayer(id)) {
            map.setPaintProperty(id, "fill-color", "#A1E8A1");
          }
        });
        layersToHide.forEach((id) => {
          if (map.getLayer(id)) {
            map.setLayoutProperty(id, "visibility", "none");
          }
        });
        pathsToRecolor.forEach((id) => {
          if (map.getLayer(id)) {
            map.setPaintProperty(id, "line-color", "#efeeef");
          }
        });
        if (map.getLayer("Building") || map.getLayer("Building 3D")) {
          map.setLayerZoomRange("Building", 14, 24);
          map.setLayerZoomRange("Building 3D", 14, 24);
        }
      }

      // ponytail: single source of truth — every filter change syncs the ?date= param
      function syncDateParam(iso) {
        const u = new URL(location.href);
        if (iso) u.searchParams.set("date", iso);
        else u.searchParams.delete("date");
        history.replaceState(null, "", u);
      }
      function filterByDate(selectedDate) {
        const resetButton = document.getElementById("reset-button");
        syncDateParam(selectedDate);
        resetButton.hidden = !selectedDate; // UI state first — map may not be styled yet
        try {
          if (!selectedDate) {
            map.setFilter(EVENT_LAYER_ID, null);
          } else {
            map.setFilter(EVENT_LAYER_ID, [
              "all",
              ["<=", ["get", "from_date"], selectedDate],
              [">=", ["get", "to_date"], selectedDate],
            ]);
          }
        } catch {
          /* style still loading — layer filter applies on next load */
        }
      }

      // DD/MM, or DD/MM/YYYY only when the year is not the current one
      function formatDate(dateString) {
        if (!dateString || dateString.length < 10) return "";
        const parts = dateString.split("-");
        const dm = `${+parts[2]}/${+parts[1]}`; // + strips leading zeros: 04/10 -> 4/10
        return parts[0] === String(new Date().getFullYear())
          ? dm
          : `${dm}/${parts[0]}`;
      }

      // "90'" / "1h30" -> "90 phút" / "1 giờ 30 phút"
      function fmtDuration(t) {
        const nums = ((t || "").match(/\d+/g) || []).map(Number);
        if (!nums.length) return t;
        const [h, m] = nums.length > 1 ? nums : [0, nums[0]];
        const parts = [];
        if (h) parts.push(`${h} giờ`);
        if (m) parts.push(`${m} phút`);
        return parts.join(" ") || t;
      }

      // Readable owner label when host_name is missing: fb slug or domain
      function hostLabelFromUrl(hostUrl) {
        try {
          const u = new URL(hostUrl);
          if (u.hostname.includes("facebook.com")) {
            const skip = new Set([
              "events",
              "posts",
              "photos",
              "videos",
              "photo",
              "reel",
            ]);
            const slug = u.pathname
              .split("/")
              .filter((s) => s && !skip.has(s))[0];
            if (slug) return decodeURIComponent(slug);
          }
          return u.hostname.replace(/^www\./, "");
        } catch {
          return hostUrl;
        }
      }

      // Pascal/title case for display: "TRIỂN LÃM ABC" -> "Triển Lãm Abc"
      function toTitleCase(s) {
        return (s || "")
          .toLowerCase()
          .replace(
            /(^[\s\-–—/("']*)([a-zà-ỹ])/gu,
            (m, pre, ch) => pre + ch.toUpperCase()
          )
          .replace(
            /([\s\-–—/("']+)([a-zà-ỹ])/gu,
            (m, pre, ch) => pre + ch.toUpperCase()
          );
      }

      function generatePaginatedPopupContent(features, index) {
        const props = features[index].properties;
        const total = features.length;
        const current = index + 1;

        // Vô hiệu hóa nút nếu ở đầu hoặc cuối danh sách
        const prevDisabled = index === 0 ? "disabled" : "";
        const nextDisabled = index === total - 1 ? "disabled" : "";

        const ICON = {
          pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
        };

        const fromDateFormatted = formatDate(props.from_date);
        const toDateFormatted = formatDate(props.to_date);
        const dText =
          props.from_date === props.to_date
            ? fromDateFormatted
            : `${fromDateFormatted}-${toDateFormatted}`;
        const bits = [];
        if (props.start_time && props.start_time !== "N/A")
          bits.push(`lúc ${props.start_time}`);
        if (props.time && props.time !== "N/A")
          bits.push(fmtDuration(props.time));
        const dateHtml = `<div class="popup-time">${dText}${
          bits.length ? ` (${bits.join(", ")})` : ""
        }</div>`;

        const thumbHtml =
          props.image_url && props.image_url !== "N/A"
            ? `<img class="popup-thumb" src="${props.image_url}" alt="" loading="lazy" onerror="this.remove()">`
            : "";

        const hasEventUrl = props.event_url && props.event_url !== "N/A";
        const hasHostUrl = props.host_url && props.host_url !== "N/A";
        const hasHostName = props.host_name && props.host_name !== "N/A";
        const hostLabel = hasHostName
          ? props.host_name
          : hostLabelFromUrl(props.host_url);
        const hostHtml = hasHostUrl
          ? `<a class="popup-host" href="${props.host_url}" target="_blank" rel="noopener noreferrer"><span>${hostLabel}</span><b>›</b></a>`
          : hasHostName
          ? `<div class="popup-host"><span>${hostLabel}</span></div>`
          : "";
        const mapHtml =
          props.address_url && props.address_url !== "N/A"
            ? `<a class="popup-map" href="${props.address_url}" target="_blank" rel="noopener noreferrer" aria-label="Google Maps">${ICON.pin}</a>`
            : "";
        const detailHtml = hasEventUrl
          ? `<a class="popup-detail" href="${props.event_url}" target="_blank" rel="noopener noreferrer">Xem chi tiết</a>`
          : "";
        const eventHtml = `
          <div class="popup">
              ${thumbHtml}
              <h3 class="popup-title">${toTitleCase(props.name_vn)}</h3>
              ${hostHtml}
              ${dateHtml}
              <div class="popup-actions">${mapHtml}${detailHtml}</div>
          </div>
        `;

        // 2. HTML cho các nút điều hướng
        const navHtml = `
          <div class="popup-navigation">
              <button id="popup-prev" ${prevDisabled}>&lt; Trước</button>
              <span class="popup-pagination-counter">${current} / ${total}</span>
              <button id="popup-next" ${nextDisabled}>Tiếp &gt;</button>
          </div>
        `;

        // Chỉ hiển thị điều hướng nếu có nhiều hơn 1 sự kiện
        return `<div class="popup">${eventHtml}${
          total > 1 ? navHtml : ""
        }</div>`;
      }

      function setupEventListeners() {
        const resetButton = document.getElementById("reset-button");
        resetButton.addEventListener("click", () => {
          clearCalendar();
          filterByDate("");
        });
      }
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log("Service Worker registered for caching.");
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
