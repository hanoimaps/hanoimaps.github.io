<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1,
    viewport-fit=cover"
    />
    <title>Hanoi Maps</title>
    <meta
      name="description"
      content="Explore historic maps of Hanoi, from 1831 to 1968 — overlaid on the modern city. Search streets by French colonial or Vietnamese names."
    />

    <!-- Open Graph / link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hanoi Maps" />
    <meta property="og:title" content="Hanoi Maps — Historic Maps of Hanoi" />
    <meta
      property="og:description"
      content="Explore historic maps of Hanoi, from 1831 to 1968 — overlaid on the modern city."
    />
    <meta property="og:url" content="https://hanoimaps.github.io/" />
    <meta property="og:image" content="https://hanoimaps.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Historic 1942 map of Hanoi overlaid on the modern city"
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hanoi Maps — Historic Maps of Hanoi" />
    <meta
      name="twitter:description"
      content="Explore historic maps of Hanoi, from 1831 to 1968 — overlaid on the modern city."
    />
    <meta
      name="twitter:image"
      content="https://hanoimaps.github.io/og-image.png"
    />
    <link
      rel="preconnect"
      href="https://pub-3bf64388e8f74a8a97c18eb8dc6ff165.r2.dev"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://unpkg.com/maplibre-gl@^5.9.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@^5.9.0/dist/maplibre-gl.js"></script>
    <script type="module" src="shared.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div
      id="top-right-controls"
      style="
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 1000;
      "
    >
      <!-- Street button will be inserted here -->
      <div
        class="layer-switcher"
        style="position: relative; top: auto; right: auto"
      >
        <select id="layer-select"></select>
      </div>
    </div>
    <div id="opacity-slider-wrapper">
      <input
        type="range"
        id="opacity-slider"
        min="0"
        max="1"
        step="0.1"
        value="0.7"
        aria-label="opacity"
      />
    </div>
    <script type="module" src="app.js" defer></script>
    <script>
      // Caching
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log("Service Worker registered for caching.");
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
